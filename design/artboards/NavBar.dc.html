<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>NavBar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=Nunito:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Principal" style="width: 100%; box-sizing: border-box; display: flex; padding: 8px 4px 22px; background: {{t.card}}; border-top: 1.5px solid {{t.line}}; font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif">
  <a href="#" aria-current="{{ s.hoy.cur }}" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{s.hoy.color}}; font-size: 13px; font-weight: {{s.hoy.w}}">
    <span style="width: 60px; height: 32px; border-radius: 16px; background: {{s.hoy.pill}}; color: {{s.hoy.icon}}; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"></path></svg>
    </span>
    Hoy
  </a>
  <a href="#" aria-current="{{ s.jardin.cur }}" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{s.jardin.color}}; font-size: 13px; font-weight: {{s.jardin.w}}">
    <span style="width: 60px; height: 32px; border-radius: 16px; background: {{s.jardin.pill}}; color: {{s.jardin.icon}}; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 13h12l-1.5 7h-9z"></path><path d="M12 13V8.5"></path><path d="M12 8.5C12 6 10 4.5 7.5 4.5c0 2.5 2 4 4.5 4z"></path><path d="M12 10c0-2.2 1.8-3.5 4-3.5 0 2.2-1.8 3.5-4 3.5z"></path></svg>
    </span>
    Jardín
  </a>
  <a href="#" aria-current="{{ s.diario.cur }}" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{s.diario.color}}; font-size: 13px; font-weight: {{s.diario.w}}">
    <span style="width: 60px; height: 32px; border-radius: 16px; background: {{s.diario.pill}}; color: {{s.diario.icon}}; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3.5" width="14" height="17" rx="2"></rect><path d="M9 3.5v17M12 8h4M12 11.5h4"></path></svg>
    </span>
    Diario
  </a>
  <a href="#" aria-label="Aprender, próximamente" aria-current="{{ s.aprender.cur }}" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{s.aprender.color}}; font-size: 13px; font-weight: {{s.aprender.w}}; position: relative">
    <span style="width: 60px; height: 32px; border-radius: 16px; background: {{s.aprender.pill}}; color: {{s.aprender.icon}}; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 2.5"><path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5zM12 6.5v13"></path></svg>
    </span>
    Aprender
    <span style="position: absolute; top: -2px; left: 50%; margin-left: 6px; padding: 0 6px; border-radius: 8px; background: {{t.terraSoft}}; color: {{t.terraInk}}; font-size: 10px; font-weight: 800; line-height: 16px">pronto</span>
  </a>
  <a href="#" aria-current="{{ s.herbario.cur }}" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{s.herbario.color}}; font-size: 13px; font-weight: {{s.herbario.w}}">
    <span style="width: 60px; height: 32px; border-radius: 16px; background: {{s.herbario.pill}}; color: {{s.herbario.icon}}; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="3" width="15" height="18" rx="1.5"></rect><path d="M8.5 17c0-5 3-8 7-9 0 5-3 8-7 9z"></path><path d="M8.5 17l4-4"></path></svg>
    </span>
    Herbario
  </a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"activa":{"editor":"enum","options":["hoy","jardin","diario","aprender","herbario"],"default":"hoy"},"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":88}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const activa = this.props.activa ?? 'hoy';
    const t = dark
      ? { card: '#1A1F17', line: '#343D2E', ink: '#F5F2E9', muted: '#B4BCAA', leafSoft: '#2A3D24', leafInk: '#C4EBB6', terraSoft: '#3E2618', terraInk: '#F4B490' }
      : { card: '#FFFFFF', line: '#DCD3C0', ink: '#121610', muted: '#4A5244', leafSoft: '#DCEAD2', leafInk: '#1F421D', terraSoft: '#F5DFD2', terraInk: '#7E3818' };
    const s = {};
    ['hoy', 'jardin', 'diario', 'aprender', 'herbario'].forEach((k) => {
      const on = k === activa;
      s[k] = on
        ? { color: t.ink, pill: t.leafSoft, icon: t.leafInk, w: 800, cur: 'page' }
        : { color: t.muted, pill: 'transparent', icon: t.muted, w: 700, cur: undefined };
    });
    return { t, s };
  }
}
</script>
</body>
</html>
