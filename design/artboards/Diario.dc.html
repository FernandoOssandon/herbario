<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Diario</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=Nunito:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 1120px; position: relative; overflow: hidden; display: flex; flex-direction: column; box-sizing: border-box; font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif; background: {{t.bg}}; color: {{t.ink}}">

  <header style="padding: 52px 18px 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <div style="display: flex; flex-direction: column">
      <h1 style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-size: 34px; font-weight: 400; line-height: 1.1">Diario</h1>
      <p style="margin: 0; font-size: 16px; font-weight: 700; color: {{t.muted}}">42 entradas desde septiembre</p>
    </div>
    <div style="display: flex; gap: 8px">
      <button aria-label="Buscar en el diario" style="width: 48px; height: 48px; box-sizing: border-box; border-radius: 50%; border: 2px solid {{t.line}}; background: {{t.card}}; color: {{t.ink}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6"></circle><path d="m15 15 5 5"></path></svg>
      </button>
      <a href="EntradaEditor.dc.html" style="min-height: 48px; padding: 0 16px; box-sizing: border-box; border-radius: 24px; background: {{t.leaf}}; color: {{t.onLeaf}}; display: flex; align-items: center; gap: 6px; text-decoration: none; font-size: 16px; font-weight: 800">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        Entrada
      </a>
    </div>
  </header>

  <div role="group" aria-label="Tipo de entrada" style="padding: 4px 16px 0; display: flex; gap: 8px; overflow: hidden">
    <dc-import name="Chip" tipo="filtro" label="Todo" selected="{{ true }}" dark="{{ dark }}" hint-size="80px,44px"></dc-import>
    <dc-import name="Chip" tipo="filtro" label="Observación" dark="{{ dark }}" hint-size="130px,44px"></dc-import>
    <dc-import name="Chip" tipo="filtro" label="Cuidado" dark="{{ dark }}" hint-size="100px,44px"></dc-import>
    <dc-import name="Chip" tipo="filtro" label="Problema" dark="{{ dark }}" hint-size="110px,44px"></dc-import>
    <dc-import name="Chip" tipo="filtro" label="Cosecha" dark="{{ dark }}" hint-size="100px,44px"></dc-import>
  </div>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 18px">
    <sc-for list="{{ dias }}" as="d" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0 2px; font-size: 14px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: {{t.muted}}">{{ d.titulo }}</h2>
        <sc-for list="{{ d.entradas }}" as="e" hint-placeholder-count="2">
          <article style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; background: {{t.card}}; border: 1.5px solid {{t.line}}; border-radius: 20px">
            <div style="display: flex; align-items: center; gap: 8px">
              <span style="display: inline-flex; align-items: center; gap: 5px; min-height: 26px; padding: 0 9px; border-radius: 10px; background: {{e.bg}}; color: {{e.ink}}; font-size: 13px; font-weight: 800">
                <sc-if value="{{ e.isFoto }}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3.5L9 5.5h6L16.5 8H20v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></sc-if>
                <sc-if value="{{ e.isCuidado }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5c-3 4-6 7.2-6 10.5a6 6 0 0 0 12 0c0-3.3-3-6.5-6-10.5z"></path></svg></sc-if>
                <sc-if value="{{ e.isAprendizaje }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17h6M10 20h4"></path><path d="M12 3.5a5.5 5.5 0 0 0-3.3 9.9c.6.5 1 1.3 1 2.1V17h4.6v-1.5c0-.8.4-1.6 1-2.1A5.5 5.5 0 0 0 12 3.5z"></path></svg></sc-if>
                <sc-if value="{{ e.isHito }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4M6 4h11l-2 4 2 4H6"></path></svg></sc-if>
                {{ e.tipoLabel }}
              </span>
              <span style="flex: 1; font-size: 14px; font-weight: 800">{{ e.plantas }}</span>
              <span style="font-size: 13px; font-weight: 700; color: {{t.muted}}">{{ e.hora }}</span>
            </div>
            <p style="margin: 0; font-size: 16px; font-weight: 600; line-height: 1.45">{{ e.texto }}</p>
            <sc-if value="{{ e.foto }}" hint-placeholder-val="{{ false }}">
              <div role="img" aria-label="Foto adjunta" style="height: 150px; border-radius: 14px; background: {{t.phBg}}; color: {{t.phInk}}; display: flex; align-items: center; justify-content: center">
                <svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15h10l-1.3 6H8.3z"></path><path d="M12 15V9"></path><path d="M12 10c0-3.2-2.2-5.2-5.5-5.2 0 3.2 2.2 5.2 5.5 5.2z"></path><path d="M12 12c0-2.6 1.9-4.2 4.6-4.2 0 2.6-1.9 4.2-4.6 4.2z"></path></svg>
              </div>
            </sc-if>
            <sc-if value="{{ e.hasMeta }}" hint-placeholder-val="{{ true }}">
              <div style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center">
                <sc-for list="{{ e.tags }}" as="tg" hint-placeholder-count="1">
                  <dc-import name="Chip" tipo="etiqueta" label="{{ tg }}" dark="{{ dark }}" hint-size="90px,28px"></dc-import>
                </sc-for>
                <sc-if value="{{ e.clima }}" hint-placeholder-val="{{ false }}">
                  <span style="display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; color: {{t.muted}}"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2"></path></svg>{{ e.clima }}</span>
                </sc-if>
              </div>
            </sc-if>
          </article>
        </sc-for>
      </section>
    </sc-for>
  </main>

  <a href="RegistroRapido.dc.html" aria-label="Registro rápido" style="position: absolute; right: 18px; bottom: 108px; width: 64px; height: 64px; border-radius: 22px; background: {{t.terra}}; color: {{t.onTerra}}; box-shadow: 0 8px 20px rgba(60, 25, 10, 0.3); display: flex; align-items: center; justify-content: center">
    <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
  </a>

  <dc-import name="NavBar" activa="diario" dark="{{ dark }}" hint-size="100%,88px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const L = { bg: '#F7F4EC', card: '#FFFFFF', line: '#DCD3C0', ink: '#121610', muted: '#4A5244', leaf: '#2C5A2A', onLeaf: '#FFFFFF', terra: '#94431F', onTerra: '#FFFFFF', phBg: '#DCE6D0', phInk: '#3E5A36' };
    const D = { bg: '#0E110D', card: '#1A1F17', line: '#343D2E', ink: '#F5F2E9', muted: '#B4BCAA', leaf: '#A3D693', onLeaf: '#0E1A0B', terra: '#EE9B70', onTerra: '#1E0E05', phBg: '#26331F', phInk: '#A9C99C' };
    const KL = { foto: ['#DCEAD2', '#1F421D', 'Foto'], cuidado: ['#DCEAD2', '#1F421D', 'Cuidado'], aprendizaje: ['#DCE9F2', '#234E6B', 'Aprendizaje'], hito: ['#DCE9F2', '#234E6B', 'Hito'] };
    const KD = { foto: ['#2A3D24', '#C4EBB6', 'Foto'], cuidado: ['#2A3D24', '#C4EBB6', 'Cuidado'], aprendizaje: ['#182C3A', '#9CCBEA', 'Aprendizaje'], hito: ['#182C3A', '#9CCBEA', 'Hito'] };
    const K = dark ? KD : KL;
    const e = (tipo, plantas, hora, texto, foto, tags, clima) => ({
      tipoLabel: K[tipo][2], bg: K[tipo][0], ink: K[tipo][1],
      isFoto: tipo === 'foto', isCuidado: tipo === 'cuidado', isAprendizaje: tipo === 'aprendizaje', isHito: tipo === 'hito',
      plantas, hora, texto, foto, tags, clima, hasMeta: tags.length > 0 || !!clima
    });
    return {
      dark, t: dark ? D : L,
      dias: [
        { titulo: 'Hoy · martes 27', entradas: [
          e('foto', 'Tomillo', '10:42', 'Se está estirando hacia la ventana.', true, ['poca luz'], ''),
          e('cuidado', 'Cuna de Moisés', '09:15', 'Tierra seca a 3 cm. Regué hasta que escurrió por abajo.', false, [], 'Soleado, 18 °C')
        ] },
        { titulo: 'Ayer · lunes 26', entradas: [
          e('aprendizaje', 'Tomillo, Menta', '21:30', 'Lo ahilado no se recupera: hay que despuntar y darle más luz para que lo nuevo crezca compacto.', false, ['luz', 'para el libro'], '')
        ] },
        { titulo: 'Sábado 24', entradas: [
          e('hito', 'Alocasia', '12:05', 'Asoma una hoja nueva, todavía enrollada.', true, [], '')
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
