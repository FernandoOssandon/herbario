<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Chip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=Nunito:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<span style="display: inline-flex; font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif">
  <sc-if value="{{ isEstado }}" hint-placeholder-val="{{ true }}">
    <span style="display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 10px; border-radius: 10px; box-sizing: border-box; background: {{e.bg}}; color: {{e.ink}}; font-size: 14px; font-weight: 800; white-space: nowrap">
      <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: {{e.dot}}"></span>
      {{ estadoLabel }}
    </span>
  </sc-if>
  <sc-if value="{{ isEtiqueta }}" hint-placeholder-val="{{ false }}">
    <span style="display: inline-flex; align-items: center; gap: 5px; min-height: 28px; padding: 0 10px; border-radius: 10px; box-sizing: border-box; background: {{t.neutralBg}}; color: {{t.ink}}; font-size: 14px; font-weight: 700; white-space: nowrap">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12V4h8l8 8-8 8z"></path><circle cx="8" cy="8" r="1.3"></circle></svg>
      {{ label }}
    </span>
  </sc-if>
  <sc-if value="{{ isFiltro }}" hint-placeholder-val="{{ false }}">
    <button aria-pressed="{{ pressed }}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 22px; box-sizing: border-box; border: 1.5px solid {{f.border}}; background: {{f.bg}}; color: {{f.ink}}; font-family: inherit; font-size: 15px; font-weight: 800; white-space: nowrap; cursor: pointer">
      <sc-if value="{{ selected }}" hint-placeholder-val="{{ false }}">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17 19 7.5"></path></svg>
      </sc-if>
      {{ label }}
    </button>
  </sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tipo":{"editor":"enum","options":["estado","etiqueta","filtro"],"default":"estado"},"estado":{"editor":"enum","options":["activa","observacion","recuperacion","plantin","perdida"],"default":"observacion"},"label":{"editor":"text","default":"Balcón"},"selected":{"editor":"boolean","default":false},"dark":{"editor":"boolean","default":false},"$preview":{"width":200,"height":44}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const tipo = this.props.tipo ?? 'estado';
    const estado = this.props.estado ?? 'observacion';
    const selected = this.props.selected ?? false;
    const t = dark
      ? { ink: '#F5F2E9', muted: '#B4BCAA', line: '#343D2E', card: '#1A1F17', neutralBg: '#262B22', leaf: '#A3D693', onLeaf: '#0E1A0B' }
      : { ink: '#121610', muted: '#4A5244', line: '#DCD3C0', card: '#FFFFFF', neutralBg: '#ECE7DB', leaf: '#2C5A2A', onLeaf: '#FFFFFF' };
    const EL = {
      activa: { bg: '#DCEAD2', ink: '#1F421D', dot: '#2C5A2A', label: 'Activa' },
      observacion: { bg: '#DCE9F2', ink: '#234E6B', dot: '#2F6A91', label: 'En observación' },
      recuperacion: { bg: '#F5DFD2', ink: '#7E3818', dot: '#94431F', label: 'En recuperación' },
      plantin: { bg: '#E4EEDD', ink: '#2C4A22', dot: '#6E9A57', label: 'Plantín' },
      perdida: { bg: '#ECE7DB', ink: '#4A5244', dot: '#7C7A70', label: 'Ya no está' }
    };
    const ED = {
      activa: { bg: '#2A3D24', ink: '#C4EBB6', dot: '#A3D693', label: 'Activa' },
      observacion: { bg: '#182C3A', ink: '#9CCBEA', dot: '#6FB2DE', label: 'En observación' },
      recuperacion: { bg: '#3E2618', ink: '#F4B490', dot: '#EE9B70', label: 'En recuperación' },
      plantin: { bg: '#24341E', ink: '#BFE0AE', dot: '#8FC27A', label: 'Plantín' },
      perdida: { bg: '#262B22', ink: '#B4BCAA', dot: '#8A8F82', label: 'Ya no está' }
    };
    const e = (dark ? ED : EL)[estado] || (dark ? ED : EL).activa;
    const f = selected
      ? { bg: t.leaf, ink: t.onLeaf, border: t.leaf }
      : { bg: t.card, ink: t.ink, border: t.line };
    return {
      t, e, f, selected,
      pressed: selected ? 'true' : 'false',
      label: this.props.label ?? 'Balcón',
      estadoLabel: e.label,
      isEstado: tipo === 'estado', isEtiqueta: tipo === 'etiqueta', isFiltro: tipo === 'filtro'
    };
  }
}
</script>
</body>
</html>
