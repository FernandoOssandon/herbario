<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nueva planta · paso 1 foto</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=Nunito:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; box-sizing: border-box; font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif; background: {{t.bg}}; color: {{t.ink}}">

  <header style="padding: 52px 16px 8px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="Jardin.dc.html" aria-label="Cancelar y cerrar" style="width: 48px; height: 48px; box-sizing: border-box; border-radius: 50%; border: 2px solid {{t.line}}; background: {{t.card}}; color: {{t.ink}}; display: flex; align-items: center; justify-content: center; flex: none">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </a>
      <div style="flex: 1; display: flex; flex-direction: column">
        <span style="font-size: 14px; font-weight: 800; color: {{t.muted}}">Nueva planta · paso 1 de 3</span>
        <span style="font-size: 18px; font-weight: 800">Foto</span>
      </div>
    </div>
    <div role="progressbar" aria-label="Progreso" aria-valuemin="1" aria-valuemax="3" aria-valuenow="1" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <span style="height: 6px; border-radius: 3px; background: {{t.leaf}}"></span>
      <span style="height: 6px; border-radius: 3px; background: {{t.line}}"></span>
      <span style="height: 6px; border-radius: 3px; background: {{t.line}}"></span>
    </div>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 12px 16px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-size: 28px; font-weight: 400; line-height: 1.15">Empieza con una foto</h1>
      <p style="margin: 0; font-size: 16px; font-weight: 600; line-height: 1.45; color: {{t.muted}}">Será su portada en el jardín y la primera página de su historia.</p>
    </div>
    <dc-import name="PhotoPicker" estado="foto" dark="{{ dark }}" hint-size="100%,320px"></dc-import>
    <div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 16px; background: {{t.blueBg}}; color: {{t.blueInk}}">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M9 17h6M10 20h4"></path><path d="M12 3.5a5.5 5.5 0 0 0-3.3 9.9c.6.5 1 1.3 1 2.1V17h4.6v-1.5c0-.8.4-1.6 1-2.1A5.5 5.5 0 0 0 12 3.5z"></path></svg>
      <p style="margin: 0; font-size: 15px; font-weight: 700; line-height: 1.4">Toma siempre la foto desde el mismo ángulo: así notarás cambios que día a día no se ven.</p>
    </div>
  </main>

  <footer style="padding: 12px 16px 34px; display: flex; gap: 10px; background: {{t.bg}}">
    <button style="min-height: 56px; padding: 0 18px; border-radius: 28px; border: 1.5px solid {{t.line}}; background: transparent; color: {{t.ink}}; font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer">Sin foto</button>
    <a href="NuevaEspecie.dc.html" style="flex: 1; min-height: 56px; border-radius: 28px; background: {{t.leaf}}; color: {{t.onLeaf}}; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none">Siguiente<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9.5 6 6 6-6 6"></path></svg></a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const L = { bg: '#F7F4EC', card: '#FFFFFF', line: '#DCD3C0', ink: '#121610', muted: '#4A5244', leaf: '#2C5A2A', onLeaf: '#FFFFFF', blueInk: '#234E6B', blueBg: '#DCE9F2' };
    const D = { bg: '#0E110D', card: '#1A1F17', line: '#343D2E', ink: '#F5F2E9', muted: '#B4BCAA', leaf: '#A3D693', onLeaf: '#0E1A0B', blueInk: '#9CCBEA', blueBg: '#182C3A' };
    return { dark, t: dark ? D : L };
  }
}
</script>
</body>
</html>
