<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Registro rápido</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=Nunito:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif; color: {{t.ink}}; background: {{t.bg}}">
  <div aria-hidden="true" style="position: absolute; inset: 0">
    <dc-import name="Hoy" dark="{{ dark }}" hint-size="390px,844px"></dc-import>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: {{t.scrim}}"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="rq-t" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; background: {{t.card}}; border-radius: 28px 28px 0 0; padding: 10px 16px 120px; display: flex; flex-direction: column; gap: 10px">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: {{t.line}}"></span>
    <h2 id="rq-t" style="margin: 4px 4px 4px; font-family: 'Young Serif', Georgia, serif; font-size: 24px; font-weight: 400">Registro rápido</h2>

    <a href="ProtoFoto.dc.html" style="display: flex; align-items: center; gap: 14px; min-height: 80px; padding: 10px 14px; box-sizing: border-box; border-radius: 20px; background: {{t.terraSoft}}; color: {{t.terraInk}}; text-decoration: none">
      <span aria-hidden="true" style="width: 52px; height: 52px; border-radius: 16px; background: {{t.terra}}; color: {{t.onTerra}}; display: flex; align-items: center; justify-content: center; flex: none"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3.5L9 5.5h6L16.5 8H20v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 800">Foto rápida</span><span style="font-size: 14px; font-weight: 700">Dispara y listo. Va al diario de la planta.</span></span>
    </a>
    <a href="EntradaEditor.dc.html" style="display: flex; align-items: center; gap: 14px; min-height: 80px; padding: 10px 14px; box-sizing: border-box; border-radius: 20px; border: 1.5px solid {{t.line}}; color: {{t.ink}}; text-decoration: none">
      <span aria-hidden="true" style="width: 52px; height: 52px; border-radius: 16px; background: {{t.neutralBg}}; color: {{t.ink}}; display: flex; align-items: center; justify-content: center; flex: none"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19l1-4L16 5l3 3L9 18z"></path><path d="M14 7l3 3"></path></svg></span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 800">Nota rápida</span><span style="font-size: 14px; font-weight: 700; color: {{t.muted}}">Una línea ahora; la ordenas después.</span></span>
    </a>
    <a href="RevisarRiego.dc.html" style="display: flex; align-items: center; gap: 14px; min-height: 80px; padding: 10px 14px; box-sizing: border-box; border-radius: 20px; border: 1.5px solid {{t.line}}; color: {{t.ink}}; text-decoration: none">
      <span aria-hidden="true" style="width: 52px; height: 52px; border-radius: 16px; background: {{t.leafSoft}}; color: {{t.leafInk}}; display: flex; align-items: center; justify-content: center; flex: none"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5c-3 4-6 7.2-6 10.5a6 6 0 0 0 12 0c0-3.3-3-6.5-6-10.5z"></path></svg></span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 800">Regué</span><span style="font-size: 14px; font-weight: 700; color: {{t.muted}}">Marca qué plantas regaste y cómo estaba la tierra.</span></span>
    </a>
  </section>

  <a href="Hoy.dc.html" aria-label="Cerrar registro rápido" style="position: absolute; right: 18px; bottom: 30px; width: 64px; height: 64px; border-radius: 22px; background: {{t.ink}}; color: {{t.card}}; display: flex; align-items: center; justify-content: center">
    <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const L = { bg: '#F7F4EC', card: '#FFFFFF', line: '#DCD3C0', ink: '#121610', muted: '#4A5244', leafSoft: '#DCEAD2', leafInk: '#1F421D', terra: '#94431F', onTerra: '#FFFFFF', terraSoft: '#F5DFD2', terraInk: '#7E3818', neutralBg: '#ECE7DB', scrim: 'rgba(18, 22, 16, 0.55)' };
    const D = { bg: '#0E110D', card: '#1A1F17', line: '#343D2E', ink: '#F5F2E9', muted: '#B4BCAA', leafSoft: '#2A3D24', leafInk: '#C4EBB6', terra: '#EE9B70', onTerra: '#1E0E05', terraSoft: '#3E2618', terraInk: '#F4B490', neutralBg: '#262B22', scrim: 'rgba(0, 0, 0, 0.62)' };
    return { dark, t: dark ? D : L };
  }
}
</script>
</body>
</html>
