<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>EmptyState</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=Nunito:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; box-sizing: border-box; padding: 24px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif; color: {{t.ink}}; background: {{t.card}}; border: 1.5px solid {{t.line}}; border-radius: 24px">
  <div aria-hidden="true" style="width: 112px; height: 112px; border-radius: 50%; background: {{t.leafSoft}}; color: {{t.leafInk}}; display: flex; align-items: center; justify-content: center">
    <sc-if value="{{ v.hoy }}" hint-placeholder-val="{{ true }}">
      <svg width="68" height="68" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><circle cx="44" cy="16" r="6"></circle><path d="M44 4v3M44 25v3M32 16h3M53 16h3"></path><path d="M14 38h30l-3 18H17z"></path><path d="M12 38h34"></path><path d="M29 38V26"></path><path d="M29 28c0-6-5-10-11-10 0 6 5 10 11 10z"></path><path d="M29 32c0-4 3-7 8-7 0 4-3 7-8 7z"></path></svg>
    </sc-if>
    <sc-if value="{{ v.jardin }}" hint-placeholder-val="{{ false }}">
      <svg width="68" height="68" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M10 40h28l-3 16H13z"></path><path d="M8 40h32"></path><path d="M24 40V30"></path><path d="M24 32c0-6-4-9-10-9 0 6 4 9 10 9z"></path><path d="M38 14h6l2-4h8l2 4h4v18H38z"></path><circle cx="49" cy="23" r="5"></circle></svg>
    </sc-if>
    <sc-if value="{{ v.diario }}" hint-placeholder-val="{{ false }}">
      <svg width="68" height="68" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="8" width="36" height="48" rx="3"></rect><path d="M22 8v48"></path><path d="M30 42c0-11 6-17 14-18 0 11-6 17-14 18z"></path><path d="M30 42l8-8"></path></svg>
    </sc-if>
    <sc-if value="{{ v.pronto }}" hint-placeholder-val="{{ false }}">
      <svg width="68" height="68" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M18 12h28v8c0 6-6 9-6 12s6 6 6 12v8H18v-8c0-6 6-9 6-12s-6-6-6-12z"></path><path d="M14 12h36M14 52h36"></path><path d="M26 46c0-3 3-5 6-5s6 2 6 5"></path></svg>
    </sc-if>
  </div>
  <h3 style="margin: 4px 0 0; font-family: 'Young Serif', Georgia, serif; font-size: 22px; font-weight: 400; line-height: 1.2">{{ c.title }}</h3>
  <p style="margin: 0; font-size: 16px; font-weight: 600; line-height: 1.45; color: {{t.muted}}; text-wrap: pretty">{{ c.body }}</p>
  <button style="margin-top: 4px; min-height: 52px; padding: 0 22px; border-radius: 26px; border: 0; background: {{t.leaf}}; color: {{t.onLeaf}}; font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer">{{ c.cta }}</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variante":{"editor":"enum","options":["hoy","jardin","diario","pronto"],"default":"hoy"},"dark":{"editor":"boolean","default":false},"$preview":{"width":358,"height":380}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const v = this.props.variante ?? 'hoy';
    const t = dark
      ? { card: '#1A1F17', line: '#343D2E', ink: '#F5F2E9', muted: '#B4BCAA', leaf: '#A3D693', onLeaf: '#0E1A0B', leafSoft: '#2A3D24', leafInk: '#C4EBB6' }
      : { card: '#FFFFFF', line: '#DCD3C0', ink: '#121610', muted: '#4A5244', leaf: '#2C5A2A', onLeaf: '#FFFFFF', leafSoft: '#DCEAD2', leafInk: '#1F421D' };
    const copy = {
      hoy: { title: 'Todo al día', body: 'Hoy no hay cuidados pendientes. Mira el revés de las hojas: ahí se esconden los pulgones antes de que se noten.', cta: 'Anotar una observación' },
      jardin: { title: 'Tu jardín empieza con una foto', body: 'Agrega tu primera planta. Te ayudamos a nombrarla y a armar su plan de cuidados según dónde vive.', cta: 'Agregar planta' },
      diario: { title: 'Tu diario está en blanco', body: 'Una foto por semana de la misma planta basta para ver cómo crece. Parte por la que más te intriga.', cta: 'Tomar una foto' },
      pronto: { title: 'Esto viene pronto', body: 'Mientras tanto, registra en el diario tus cosechas y preparaciones: serán la base de esta sección.', cta: 'Ir al diario' }
    };
    return {
      t, c: copy[v] || copy.hoy,
      v: { hoy: v === 'hoy', jardin: v === 'jardin', diario: v === 'diario', pronto: v === 'pronto' }
    };
  }
}
</script>
</body>
</html>
